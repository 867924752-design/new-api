# ============================================================
# 编译并发布「我的」new-api 镜像
#
# 和官方那个 docker-build.yml 的区别:
#   · 官方推到 calciumion/new-api (别人的 Docker Hub 账号), 你的 fork 跑会失败
#   · 这个推到你自己的 GitHub 镜像仓库, 用 GitHub 自带凭证, 不需要配任何密钥
#
# 什么时候跑:
#   ① 打 tag 时自动跑    —— 例: git tag v1.0.0-rc.47-jinshen-1 && git push origin --tags
#   ② 手动点按钮触发    —— 在 GitHub 仓库页面 Actions 标签页点 Run workflow
#
# 版本号从哪来: tag 名。Dockerfile 会把它写进编译产物, 后台"关于"页能看到。
# ============================================================

name: 编译我的镜像

on:
  push:
    tags:
      - 'v*'          # 任何以 v 开头的 tag 都会触发
  workflow_dispatch:
    inputs:
      tag:
        description: '版本号 (例: v1.0.0-rc.47-jinshen-1)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/867924752-design/new-api

jobs:
  build:
    name: 编译 linux/amd64 镜像
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # 推镜像需要这个权限

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 确定版本号并写入 VERSION
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "${TAG}" > VERSION
          echo "本次编译版本号: ${TAG}"

      - name: 准备 Docker 编译环境
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub 镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 编译并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出结果
        run: |
          echo "## 编译完成 ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**镜像地址**（服务器上用它）:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ env.IMAGE }}:${{ env.TAG }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**部署命令**:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.IMAGE }}:${{ env.TAG }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
